# ---------------------------------------------------------------------------
# Stack Spending Diary:
#   - postgres   : CSDL PostgreSQL cục bộ cho môi trường phát triển / kiểm thử
#   - ai-service : Dịch vụ AI Service (FastAPI NLU & OCR Pipeline)
#   - backend    : Máy chủ điều phối nghiệp vụ Node.js Express + Swagger UI tại /docs
#   - web-admin  : Trang web quản trị React + Vite phục vụ NLU Ops và quản lý
# ---------------------------------------------------------------------------
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: spending-diary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-expense_ai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-expense_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ../expense-ocr-nlu
      dockerfile: Dockerfile
    container_name: spending-diary-ai-service
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DEVICE: ${DEVICE:-cpu}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      USE_REAL_NLU: ${USE_REAL_NLU:-true}
      USE_REAL_OCR: ${USE_REAL_OCR:-false}
      LAZY_LOAD_MODELS: ${LAZY_LOAD_MODELS:-true}
    ports:
      - "8000:8000"
    volumes:
      - ../expense-ocr-nlu:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spending-diary-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-expense_ai}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-for-spending-diary}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT_MS: "30000"
      SCHEMA_SQL_PATH: /app/database/schema.sql
    ports:
      - "4000:4000"
    volumes:
      - ./database:/app/database:ro
      - ./backend/src/db/migrations:/app/src/db/migrations:ro

  web-admin:
    build:
      context: ./frontend/web-admin
      dockerfile: Dockerfile
    container_name: spending-diary-web-admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:4000/api
    ports:
      - "5173:80"

volumes:
  pgdata:
